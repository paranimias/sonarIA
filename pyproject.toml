[project]
name = "sonaria"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "common",
    "core",
    "openclaw-adapter",
    "whatsapp",
    "data",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services"]

[tool.uv.sources]
common = { workspace = true }
core = { workspace = true }
openclaw-adapter = { workspace = true }
whatsapp = { workspace = true }
data = { workspace = true }
