name: recommend_events
description: >
  Busca eventos musicales en Bogotá scrapeando tuboleta.com,
  ticketmaster.com.co y la agenda cultural oficial de Bogotá.
  Filtra por género, fecha o artista.
input_schema:
  type: object
  properties:
    genre:
      type: string
      description: "Género musical (ej: jazz, salsa, rock, electrónica, reggaeton, cumbia)"
    date:
      type: string
      description: "Fecha o período (ej: 'este fin de semana', '2026-07-15')"
    artist:
      type: string
      description: "Nombre del artista o banda"
  required: []
handler_module: "agent.tools.recommend_events"
