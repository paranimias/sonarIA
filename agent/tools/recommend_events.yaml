name: recommend_events
description: >
  Consulta la base de datos de eventos en Bogotá (actualizada diariamente).
  Incluye conciertos de Eventbrite, tuboleta y la agenda cultural de Bogotá.
  Llama sin filtros para ver todos los eventos disponibles.
  Usa genre solo para géneros específicos como jazz, rock, salsa, electrónica.
  Para preguntas generales sobre eventos o conciertos, no uses el parámetro genre.
input_schema:
  type: object
  properties:
    genre:
      type: string
      description: "Género musical (ej: jazz, salsa, rock, electrónica, reggaeton, cumbia)"
    date:
      type: string
      description: "Fecha o período (ej: 'este fin de semana', '2026-07-15')"
    artist:
      type: string
      description: "Nombre del artista o banda"
  required: []
handler_module: "agent.tools.recommend_events"
