name: recommend_music
description: >
  Recomienda artistas similares y canciones usando Last.fm.
  Usa 'artist' para encontrar artistas parecidos y sus top tracks.
  Usa 'genre' para ver lo más popular de un género (tag de Last.fm).
input_schema:
  type: object
  properties:
    artist:
      type: string
      description: "Artista de referencia (busca similares y sus canciones más populares)"
    genre:
      type: string
      description: "Género como tag de Last.fm (ej: jazz, salsa, electronic, cumbia, reggaeton, rock)"
  required: []
handler_module: "agent.tools.recommend_music"
